name: Build DashPad IPA
on:
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: macos-26
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Build Unsigned Archive
        run: |
          xcodebuild -project DashPad.xcodeproj -scheme DashPad -configuration Release -destination 'generic/platform=iOS' -archivePath build/DashPad.xcarchive archive CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO
      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -r build/DashPad.xcarchive/Products/Applications/DashPad.app Payload/
          zip -r DashPad.ipa Payload
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: DashPad-IPA
          path: DashPad.ipa